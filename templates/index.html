<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Briefing</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0a0a; color: #f0f0f0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; max-width: 800px; margin: 0 auto; padding: 20px; }
        .section { margin-bottom: 40px; border-bottom: 1px solid #222; padding-bottom: 30px; }
        h2 { font-size: 12px; letter-spacing: 3px; text-transform: uppercase; color: #555; margin-bottom: 16px; }
        .loading { color: #444; font-size: 14px; }
        .error { color: #ff4444; font-size: 14px; }

        /* Weather */
        .weather-main { font-size: 64px; font-weight: 300; line-height: 1; }
        .weather-feels { font-size: 14px; color: #888; margin-top: 4px; }
        .weather-condition { font-size: 18px; margin-top: 8px; color: #ccc; }
        .weather-details { display: flex; gap: 24px; margin-top: 16px; }
        .weather-detail { font-size: 13px; color: #888; }
        .weather-detail span { color: #f0f0f0; font-size: 16px; display: block; }
        .forecast { margin-top: 24px; display: flex; flex-direction: column; gap: 8px; }
        .forecast-day { display: flex; justify-content: space-between; align-items: center; font-size: 14px; padding: 8px 0; border-bottom: 1px solid #1a1a1a; }
        .forecast-day-name { color: #888; width: 120px; }
        .forecast-temp { color: #f0f0f0; }
        .forecast-desc { color: #666; font-size: 12px; flex: 1; text-align: center; }
        .forecast-rain { color: #4a9eff; font-size: 12px; width: 60px; text-align: right; }

        /* Markets */
        .market-message { font-size: 13px; color: #666; margin-bottom: 20px; }
        .spy-bar { background: #111; border-radius: 8px; padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .spy-label { font-size: 12px; color: #555; letter-spacing: 2px; }
        .spy-price { font-size: 28px; font-weight: 300; }
        .spy-change { font-size: 16px; }
        .positive { color: #00c853; }
        .negative { color: #ff3d00; }
        .stocks-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .stocks-column h3 { font-size: 11px; letter-spacing: 2px; color: #555; margin-bottom: 12px; text-transform: uppercase; }
        .stock-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #1a1a1a; font-size: 14px; }
        .stock-ticker { color: #f0f0f0; font-weight: 500; }
        .stock-price { color: #888; font-size: 12px; }
        .stock-pct { font-size: 13px; }
        .summaries { margin-top: 24px; font-size: 14px; line-height: 1.8; color: #aaa; }
        .stock-summary-block { padding: 16px 0; border-bottom: 1px solid #1a1a1a; }
        .stock-summary-block:last-child { border-bottom: none; }
        .stock-summary-ticker { color: #f0f0f0; font-weight: 600; font-size: 13px; letter-spacing: 1px; margin-bottom: 6px; }
        
        /* News */
        .news-category { margin-bottom: 24px; }
        .news-category-label { font-size: 11px; letter-spacing: 2px; color: #555; text-transform: uppercase; margin-bottom: 12px; }
        .news-story { padding: 12px 0; border-bottom: 1px solid #1a1a1a; }
        .news-headline { font-size: 15px; color: #e0e0e0; line-height: 1.4; margin-bottom: 4px; }
        .news-why { font-size: 13px; color: #666; line-height: 1.4; }
        .news-date { font-size: 11px; color: #444; margin-top: 4px; }

        /* Perspective */
        .perspective-text { font-size: 22px; font-weight: 300; line-height: 1.5; color: #e0e0e0; border-left: 2px solid #333; padding-left: 20px; }
    </style>
</head>
<body>

    <div style="padding: 40px 0 32px 0; border-bottom: 1px solid #1a1a1a; margin-bottom: 40px;">
        <div style="font-size: 11px; letter-spacing: 4px; color: #555; text-transform: uppercase; margin-bottom: 8px;">Daily Briefing</div>
        <div id="header-date" style="font-size: 28px; font-weight: 300; color: #f0f0f0;"></div>
        <div style="font-size: 13px; color: #555; margin-top: 4px;">Cary, NC</div>
    </div>

    <div class="section" id="weather-section">
        <h2>Weather</h2>
        <div id="weather-content" class="loading">Loading weather...</div>
    </div>

    <div class="section" id="markets-section">
        <h2>Markets</h2>
        <div id="markets-content" class="loading">Loading markets...</div>
    </div>

    <div class="section" id="news-section">
        <h2>News</h2>
        <div id="news-content" class="loading">Loading news...</div>
    </div>

    <div class="section" id="perspective-section">
        <h2>Today's Perspective</h2>
        <div id="perspective-content" class="loading">Loading...</div>
    </div>

<script>
async function loadWeather() {
    try {
        const res = await fetch('/api/weather');
        const d = await res.json();
        document.getElementById('weather-content').innerHTML = `
            <div class="weather-main">${d.temperature}°</div>
            <div class="weather-condition">${d.condition}</div>
            <div class="weather-feels">Feels like ${d.feels_like}°</div>
            <div class="weather-details">
                <div class="weather-detail">Humidity<span>${d.humidity}%</span></div>
                <div class="weather-detail">Rain Chance<span>${d.rain_chance || 0}%</span></div>
                <div class="weather-detail">City<span>${d.city}</span></div>
            </div>
            <div class="forecast">
                ${(d.forecast || []).map(f => `
                    <div class="forecast-day">
                        <span class="forecast-day-name">${f.day}</span>
                        <span class="forecast-temp">${f.high}° / ${f.low}°</span>
                        <span class="forecast-desc">${f.desc}</span>
                        <span class="forecast-rain">🌧 ${f.rain}%</span>
                    </div>
                `).join('')}
            </div>
        `;
    } catch(e) {
        document.getElementById('weather-content').innerHTML = '<div class="error">Failed to load weather</div>';
    }
}

async function loadMarkets() {
    try {
        const res = await fetch('/api/stocks');
        const d = await res.json();
        const spyColor = d.spy && d.spy.pct >= 0 ? 'positive' : 'negative';
        const spySign = d.spy && d.spy.pct >= 0 ? '+' : '';
        document.getElementById('markets-content').innerHTML = `
            <div class="market-message">${d.market_message}</div>
            ${d.spy ? `
            <div class="spy-bar">
                <div>
                    <div class="spy-label">S&P 500 ETF</div>
                    <div class="spy-price">$${d.spy.price}</div>
                </div>
                <div class="spy-change ${spyColor}">${spySign}${d.spy.pct}%</div>
            </div>` : ''}
            <div class="stocks-grid">
                <div class="stocks-column">
                    <h3>Top Gainers</h3>
                    ${d.gainers.map(s => `
                        <div class="stock-row">
                            <div>
                                <div class="stock-ticker">${s.ticker}</div>
                                <div class="stock-price">$${s.price}</div>
                            </div>
                            <div class="stock-pct positive">+${s.pct}%</div>
                        </div>
                    `).join('')}
                </div>
                <div class="stocks-column">
                    <h3>Top Losers</h3>
                    ${d.losers.map(s => `
                        <div class="stock-row">
                            <div>
                                <div class="stock-ticker">${s.ticker}</div>
                                <div class="stock-price">$${s.price}</div>
                            </div>
                            <div class="stock-pct negative">${s.pct}%</div>
                        </div>
                    `).join('')}
                </div>
            </div>
            <div class="summaries">
                ${(d.summaries || []).map(s => `
                    <div class="stock-summary-block">
                        <div class="stock-summary-ticker">${s.ticker}</div>
                        <div>${s.summary}</div>
                    </div>
                `).join('')}
            </div>       `;
    } catch(e) {
        document.getElementById('markets-content').innerHTML = '<div class="error">Failed to load markets</div>';
    }
}

function loadNews() {
    const container = document.getElementById('news-content');
    container.innerHTML = '<div class="loading">Loading Global Impact...</div>';

    const categoryOrder = [
        "GLOBAL IMPACT", "WORLD", "US", "BUSINESS",
        "TECH", "SPORTS", "STATE", "CITY"
    ];
    const rendered = {};

    const source = new EventSource('/api/news-stream');

    source.onmessage = function(event) {
        const data = JSON.parse(event.data);

        // Done signal. Close the connection
        if (data.done) {
            source.close();
            return;
        }

        // Store this category
        rendered[data.category] = data.stories;

        // Update loading message to show next category
        const nextIndex = categoryOrder.indexOf(data.category) + 1;
        const nextCat = categoryOrder[nextIndex];

        // Re-render all received categories in correct order
        const html = categoryOrder
            .filter(cat => rendered[cat])
            .map(cat => `
                <div class="news-category">
                    <div class="news-category-label">${cat}</div>
                    ${rendered[cat].map(s => `
                        <div class="news-story">
                            <div class="news-headline">${s.headline}</div>
                            <div class="news-why">${s.why}</div>
                            <div class="news-date">${s.date}</div>
                        </div>
                    `).join('')}
                </div>
            `).join('');

        // Add loading indicator for next category if not done
        const loadingHtml = nextCat
            ? `<div class="loading" style="margin-top: 16px;">Loading ${nextCat}...</div>`
            : '';

        container.innerHTML = html + loadingHtml;
    };

    source.onerror = function() {
        source.close();
        if (Object.keys(rendered).length === 0) {
            container.innerHTML = '<div class="error">Failed to load news</div>';
        }
        // If we have some categories already, just stop and show what we have
    };
}

async function loadPerspective(force = false) {
    try {
        const url = force ? '/api/perspective?refresh=true' : '/api/perspective';
        const res = await fetch(url);
        const d = await res.json();
        document.getElementById('perspective-content').innerHTML = `
            <div class="perspective-text">${d.perspective}</div>
            <div style="margin-top: 16px;">
                <button onclick="loadPerspective(true)" style="
                    background: none;
                    border: 1px solid #333;
                    color: #555;
                    font-size: 11px;
                    letter-spacing: 2px;
                    text-transform: uppercase;
                    padding: 8px 16px;
                    cursor: pointer;
                    border-radius: 4px;
                ">New Perspective</button>
            </div>
        `;
    } catch(e) {
        document.getElementById('perspective-content').innerHTML = '<div class="error">Failed to load perspective</div>';
    }
}

function loadHeader() {
    const now = new Date();
    const dateStr = now.toLocaleDateString('en-US', {
        weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
    });
    document.getElementById('header-date').textContent = dateStr;
}

// Load weather and markets first, news and perspective in parallel after
loadWeather();
loadMarkets();
loadNews();
loadPerspective();
loadHeader();
</script>
</body>
</html>
